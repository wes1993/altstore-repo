name: Update Dopamine

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-dopamine
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Dopamine in apps.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json
          import os
          import plistlib
          import tempfile
          import urllib.request
          import zipfile
          from datetime import datetime
          from pathlib import Path

          UPSTREAM = "opa334/Dopamine"
          FEED = Path("apps.json")
          ICON_URL = (
              "https://raw.githubusercontent.com/opa334/Dopamine/3.x/"
              "Application/Dopamine/Assets.xcassets/AppIcon.appiconset/"
              "Icon-64%403x.png"
          )

          def github_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "User-Agent": "wes1993-altstore-repo",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          release = github_json(
              f"https://api.github.com/repos/{UPSTREAM}/releases/latest"
          )

          if release.get("draft") or release.get("prerelease"):
              raise RuntimeError("Latest Dopamine release is not a stable release")

          tag = str(release["tag_name"])
          published_at = release["published_at"]
          notes = (release.get("body") or "").strip()

          ipa_asset = next(
              (
                  asset
                  for asset in release.get("assets", [])
                  if str(asset.get("name", "")).lower() == "dopamine.ipa"
              ),
              None,
          )

          if not ipa_asset:
              raise RuntimeError(f"Dopamine.ipa not found in release {tag}")

          download_url = ipa_asset["browser_download_url"]

          with tempfile.TemporaryDirectory() as tmp:
              ipa_path = Path(tmp) / "Dopamine.ipa"

              req = urllib.request.Request(
                  download_url,
                  headers={"User-Agent": "wes1993-altstore-repo"},
              )

              with urllib.request.urlopen(req) as response:
                  ipa_path.write_bytes(response.read())

              size = ipa_path.stat().st_size

              with zipfile.ZipFile(ipa_path) as archive:
                  plist_names = [
                      name
                      for name in archive.namelist()
                      if name.startswith("Payload/")
                      and name.endswith(".app/Info.plist")
                      and name.count("/") == 2
                  ]

                  if not plist_names:
                      raise RuntimeError("Info.plist not found inside Dopamine.ipa")

                  info = plistlib.loads(archive.read(plist_names[0]))

          bundle_identifier = str(info.get("CFBundleIdentifier") or "").strip()
          if not bundle_identifier:
              raise RuntimeError("CFBundleIdentifier missing from Dopamine.ipa")

          version = str(
              info.get("CFBundleShortVersionString")
              or tag.lstrip("v")
          ).strip()

          build_version = str(
              info.get("CFBundleVersion")
              or version
          ).strip()

          date = (
              datetime
              .fromisoformat(published_at.replace("Z", "+00:00"))
              .date()
              .isoformat()
          )

          with FEED.open("r", encoding="utf-8") as f:
              feed = json.load(f)

          apps = feed.setdefault("apps", [])

          dopamine = next(
              (
                  app
                  for app in apps
                  if app.get("name") == "Dopamine"
                  or app.get("bundleIdentifier") == bundle_identifier
              ),
              None,
          )

          if dopamine is None:
              dopamine = {
                  "name": "Dopamine",
                  "bundleIdentifier": bundle_identifier,
                  "developerName": "opa334",
                  "subtitle": "Rootless semi-untethered jailbreak",
                  "localizedDescription": (
                      "Dopamine is a rootless semi-untethered jailbreak."
                  ),
                  "iconURL": ICON_URL,
                  "versions": [],
              }
              apps.append(dopamine)
          else:
              dopamine["bundleIdentifier"] = bundle_identifier
              dopamine.setdefault("developerName", "opa334")
              dopamine.setdefault(
                  "subtitle",
                  "Rootless semi-untethered jailbreak",
              )
              dopamine.setdefault(
                  "localizedDescription",
                  "Dopamine is a rootless semi-untethered jailbreak.",
              )
              dopamine["iconURL"] = ICON_URL

          versions = dopamine.setdefault("versions", [])

          already_present = any(
              (
                  entry.get("version") == version
                  and str(entry.get("buildVersion")) == build_version
              )
              or entry.get("downloadURL") == download_url
              for entry in versions
          )

          if already_present:
              print(
                  f"Dopamine {version} ({build_version}) already present; "
                  "no feed change required."
              )
              raise SystemExit(0)

          entry = {
              "version": version,
              "buildVersion": build_version,
              "date": date,
              "downloadURL": download_url,
              "size": size,
              "localizedDescription": notes or f"Dopamine {version}",
          }

          versions.insert(0, entry)

          with FEED.open("w", encoding="utf-8") as f:
              json.dump(feed, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print(
              f"Added Dopamine {version} ({build_version}) "
              f"from official release {tag}"
          )
          print(f"Bundle identifier: {bundle_identifier}")
          print(f"Download URL: {download_url}")
          PY

      - name: Commit changes
        run: |
          if git diff --quiet -- apps.json; then
            echo "No Dopamine update available"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps.json
          git commit -m "Update Dopamine"
          git push
